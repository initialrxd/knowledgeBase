[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-knowledge-service"
version = "0.1.0"
description = "Portable, incremental PDF knowledge service for Open WebUI and MCP"
requires-python = ">=3.11,<3.13"
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.26,<3",
  "pymupdf4llm>=0.0.25,<1",
  "lancedb>=0.20,<1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "lancedb==0.25.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy>=1.26,<2",
  "pyarrow>=18,<24",
  "mcp>=1.15,<2",
  "portalocker>=3,<4",
  "jieba>=0.42,<1",
  "tiktoken>=0.9,<1",
  "watchdog>=6,<7",
]

[project.optional-dependencies]
ocr = [
  "rapidocr>=3,<4",
  "onnxruntime>=1.20,<2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "opencv-python-headless>=4.9,<4.12",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
knowledge = "knowledge_service.cli:main"

[tool.setuptools.packages.find]
include = ["knowledge_service*"]

[tool.setuptools.package-data]
knowledge_service = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
